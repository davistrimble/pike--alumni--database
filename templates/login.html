{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Welcome back, brother</h1>
    <p class="muted">Log in to search the Pike alumni network.</p>
    <form method="post" class="stack">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <label>Email
            <input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="button">Log in</button>
    </form>
    <p class="muted small">First time here? <a href="{{ url_for('signup') }}">Create your account</a>.</p>
</section>
{% endblock %}
